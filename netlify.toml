# Build only the static website into dist. Netlify separately deploys serverless functions.
[build]
  command = "node scripts/build-site.mjs"
  publish = "dist"

[functions]
  directory = "netlify/functions"

[[redirects]]
  from = "/forums"
  to = "/forums.html"
  status = 200

[[redirects]]
  from = "/forums/"
  to = "/forums.html"
  status = 200
